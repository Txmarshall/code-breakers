name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Data lint + build + artifact lint + syntax check
        run: node build.mjs
      - name: Lint mutation tests
        run: node test-lint.mjs
      - name: Committed index.html matches the source
        run: git diff --exit-code -- index.html
